          - Standardize common platform name variants (twitter/X→Twitter, insta→Instagram,\
          \ etc.)\n- Remove duplicates and invalid entries\n- Preserve unknown but\
          \ reasonable platform names\n\n## OUTPUT REQUIREMENTS\n- Success: [\"Platform1\"\
          , \"Platform2\"] \n- No platforms found: [No platforms identified. Please\
          \ enter a valid platform name.]\n\n## EXAMPLES\n- Input: \"twitter, linkedin\"\
          \ → [\"Twitter\", \"LinkedIn\"]\n- Input: \"x and insta\" → [\"Twitter\"\
          , \"Instagram\"]\n- Input: \"invalid content\" → [No platforms identified.\
